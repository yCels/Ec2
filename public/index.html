<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; margin: 0; padding: 32px 16px; color: #1f2937; }
    .container { max-width: 600px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .primary { background: #2563eb; color: #fff; }
    .edit { background: #e5e7eb; }
    .delete { background: #ef4444; color: #fff; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e5e7eb; }
    li span { flex: 1; word-break: break-word; }
    li.done span { text-decoration: line-through; color: #9ca3af; }
    li input[type=text] { flex: 1; padding: 6px 8px; font-size: 15px; }
    .error { color: #dc2626; margin: 0 0 8px; min-height: 1em; }
    .empty { color: #6b7280; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 To-Do List</h1>
    <form id="form">
      <input type="text" id="title" placeholder="Nova tarefa..." required />
      <button class="primary" type="submit">Adicionar</button>
    </form>
    <p id="error" class="error"></p>
    <ul id="list"></ul>
  </div>

  <script>
    const API = '/api/tasks';
    const list = document.getElementById('list');
    const errorBox = document.getElementById('error');

    async function request(url, options = {}) {
      errorBox.textContent = '';
      const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        errorBox.textContent = body.error || 'Erro na requisição';
        throw new Error(body.error);
      }
      return res.status === 204 ? null : res.json();
    }

    async function load() {
      const tasks = await request(API);
      list.innerHTML = '';
      if (!tasks.length) {
        list.innerHTML = '<li class="empty">Nenhuma tarefa cadastrada.</li>';
        return;
      }
      for (const t of tasks) {
        const li = document.createElement('li');
        if (t.done) li.classList.add('done');

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = t.done;
        check.onchange = () => update(t.id, { done: check.checked });

        const span = document.createElement('span');
        span.textContent = t.title;

        const edit = document.createElement('button');
        edit.className = 'edit';
        edit.textContent = 'Editar';
        edit.onclick = () => {
          // troca o texto por um campo editável na própria linha
          const input = document.createElement('input');
          input.type = 'text';
          input.value = t.title;
          const save = document.createElement('button');
          save.className = 'primary';
          save.textContent = 'Salvar';
          const cancel = document.createElement('button');
          cancel.className = 'edit';
          cancel.textContent = 'Cancelar';

          const doSave = () => {
            const title = input.value.trim();
            if (!title) return input.focus();
            update(t.id, { title });
          };
          save.onclick = doSave;
          cancel.onclick = load;
          input.onkeydown = (e) => {
            if (e.key === 'Enter') doSave();
            if (e.key === 'Escape') load();
          };

          li.replaceChildren(check, input, save, cancel);
          input.focus();
          input.select();
        };

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = 'Remover';
        del.onclick = () => remove(t.id);

        li.append(check, span, edit, del);
        list.appendChild(li);
      }
    }

    async function update(id, data) {
      await request(`${API}/${id}`, { method: 'PUT', body: JSON.stringify(data) });
      load();
    }

    async function remove(id) {
      await request(`${API}/${id}`, { method: 'DELETE' });
      load();
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      await request(API, { method: 'POST', body: JSON.stringify({ title: input.value }) });
      input.value = '';
      load();
    };

    load();
  </script>
</body>
</html>
